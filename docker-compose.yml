services:
  db:
    image: postgres:16-alpine
    container_name: tashtech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tashtech
      POSTGRES_PASSWORD: tashtech_dev_pw
      POSTGRES_DB: tashtech
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tashtech"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
